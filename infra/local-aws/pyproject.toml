[project]
name = "sales-manager-local-aws-checks"
version = "0.1.0"
description = "Local-only AWS emulator checks, separate from application dependencies."
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3==1.43.121",
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.2",
]

[tool.uv]
required-version = "==0.13.6"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
