  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 操作者・店舗ごとに保持。再送は同じキー・入力・If-Matchを使う。
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"v[1-9][0-9]{0,9}"$
      description: GET応答の強いETag。未指定428、不一致412。
    Start:
      name: start_date
      in: query
      required: true
      schema:
        type: string
        format: date
    End:
      name: end_date
      in: query
      required: true
      schema:
        type: string
        format: date
    ProductFilter:
      name: product_id
      in: query
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      description: 署名・スコープ・条件・有効期限を検証。空itemsでも継続する場合がある。
