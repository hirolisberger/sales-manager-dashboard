      - currency
      - status
      - version
      - total_amount_yen
      - created_at
      - updated_at
      - matched_amount_yen
      - matched_quantity
    Revision:
      type: object
      additionalProperties: false
      properties:
        sale_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        operation:
          type: string
