components:
  schemas:
    ProductCreate:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,31}$
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        default_unit_price_yen:
          type: integer
          minimum: 0
          maximum: 9999999
          description: 税込整数円。実装では1.0やtrueも拒否する。
      required:
      - code
      - name
      - default_unit_price_yen
    ProductPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        default_unit_price_yen:
          type: integer
          minimum: 0
          maximum: 9999999
          description: 税込整数円。実装では1.0やtrueも拒否する。
        is_active:
          type: boolean
      required: []
      minProperties: 1
    Product:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,31}$
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        default_unit_price_yen:
          type: integer
          minimum: 0
          maximum: 9999999
          description: 税込整数円。実装では1.0やtrueも拒否する。
        is_active:
          type: boolean
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - code
      - name
      - default_unit_price_yen
      - is_active
      - version
      - created_at
      - updated_at
    SaleCreateLine:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        unit_price_yen:
          type: integer
          minimum: 0
          maximum: 9999999
          description: 税込整数円。実装では1.0やtrueも拒否する。
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
      required:
      - product_id
      - unit_price_yen
      - quantity
    SalePatchLine:
      type: object
      additionalProperties: false
      properties:
        line_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        unit_price_yen:
          type: integer
          minimum: 0
          maximum: 9999999
          description: 税込整数円。実装では1.0やtrueも拒否する。
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
        refresh_product_snapshot:
          type: boolean
          default: false
      required:
      - product_id
      - unit_price_yen
      - quantity
    SaleCreate:
      type: object
      additionalProperties: false
      properties:
        sale_date:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SaleCreateLine'
      required:
      - sale_date
      - lines
    SalePatch:
      type: object
      additionalProperties: false
      properties:
        sale_date:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SalePatchLine'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
      required:
      - sale_date
      - lines
      - reason
    Cancellation:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
      required:
      - reason
    SaleLine:
      type: object
      additionalProperties: false
      properties:
        line_id:
          type: string
          format: uuid
        line_no:
          type: integer
          minimum: 1
          maximum: 50
        product_id:
          type: string
          format: uuid
        product_code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,31}$
        product_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        unit_price_yen:
          type: integer
          minimum: 0
          maximum: 9999999
          description: 税込整数円。実装では1.0やtrueも拒否する。
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
        line_amount_yen:
          type: integer
          minimum: 0
          maximum: 9999999999
      required:
      - line_id
      - line_no
      - product_id
      - product_code
      - product_name
      - unit_price_yen
      - quantity
      - line_amount_yen
    Sale:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sale_date:
          type: string
          format: date
        currency:
          const: JPY
        status:
          type: string
          enum:
          - confirmed
          - cancelled
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        total_amount_yen:
          type: integer
          minimum: 0
          maximum: 9999999999
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SaleLine'
      required:
      - id
      - sale_date
      - currency
      - status
      - version
      - total_amount_yen
      - created_at
      - updated_at
      - lines
    SaleSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sale_date:
          type: string
          format: date
        currency:
          const: JPY
        status:
          type: string
          enum:
          - confirmed
          - cancelled
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        total_amount_yen:
