        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        matched_amount_yen:
          type: integer
          minimum: 0
          maximum: 9999999999
        matched_quantity:
          type: integer
          minimum: 1
      required:
      - id
