            - sale_count
            - quantity
      required:
      - start_date
      - end_date
      - group_by
      - amount_yen
      - sale_count
      - quantity
      - rows
    ProductReport:
      type: object
      additionalProperties: false
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        amount_yen:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        sale_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        quantity:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              product_id:
                type: string
                format: uuid
              amount_yen:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              sale_count:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              quantity:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
            - product_id
            - amount_yen
            - sale_count
            - quantity
      required:
      - start_date
      - end_date
      - amount_yen
      - sale_count
      - quantity
      - rows
