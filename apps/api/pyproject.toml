[project]
name = "sales-manager-api"
version = "0.1.0"
description = "Python package for the sales management API."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3==1.43.121",
    "botocore==1.43.121",
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
sales-manager-api = "sales_manager_api.__main__:main"
sales-manager-data = "sales_manager_api.data_cli:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "PyYAML==6.0.3",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
required-version = "==0.13.6"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
