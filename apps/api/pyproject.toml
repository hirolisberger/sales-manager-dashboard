[project]
name = "sales-manager-api"
version = "0.1.0"
description = "Python package for the sales management API."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
sales-manager-api = "sales_manager_api.__main__:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.uv]
required-version = "==0.13.6"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
